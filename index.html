<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד אישורי הגעה</title>
  <!-- Chart.js & SheetJS מ-CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
    }

    /* מסך כניסה */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--text);
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      text-align: center;
      outline: none;
    }

    .login-card input:focus {
      border-color: var(--primary);
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .login-card button:hover {
      background: #1d4ed8;
    }

    .error-msg {
      color: var(--danger);
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* תוכן האפליקציה */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-file {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stat-card .label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      height: 380px;
      display: flex;
      flex-direction: column;
    }

    .chart-card h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .chart-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
    }

    .filters-bar {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-item select, .filter-item input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      max-height: 500px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 14px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f1f5f9;
      position: sticky;
      top: 0;
      z-index: 1;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-arriving { background: #dcfce7; color: #15803d; }
    .badge-declined { background: #fee2e2; color: #b91c1c; }
    .badge-undecided { background: #fef3c7; color: #b45309; }
    .badge-none { background: #f1f5f9; color: #475569; }

    #loading-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- מסך סיסמה -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>דשבורד אירוע</h2>
      <input type="password" id="password-input" placeholder="הזן סיסמה..." autofocus onkeydown="if(event.key==='Enter') checkAuth()">
      <button onclick="checkAuth()">כניסה</button>
      <div id="error-msg" class="error-msg">סיסמה שגויה, נסה שוב.</div>
    </div>
  </div>

  <!-- תוכן ראשי -->
  <div class="container" id="main-app">
    <header>
      <div>
        <h1 style="margin: 0; font-size: 24px;">🎉 סנכרון אישורי הגעה</h1>
        <div id="file-status" style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">טוען קובץ נתונים...</div>
      </div>
      <div class="header-actions">
        <label class="btn-file">
          📂 החלף/טען קובץ ידנית
          <input type="file" id="file-uploader" accept=".xlsx, .xls" style="display: none;" onchange="handleManualFile(event)">
        </label>
      </div>
    </header>

    <div id="loading-state">טוען את נתוני האקסל מהשרת...</div>

    <div id="dashboard-content" style="display: none;">
      <!-- מדדים -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">סה"כ מוזמנים</div>
          <div class="value" id="kpi-invited">0</div>
        </div>
        <div class="stat-card">
          <div class="label">אישרו הגעה (מגיעים)</div>
          <div class="value" id="kpi-arriving" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
          <div class="label">אחוז הגעה</div>
          <div class="value" id="kpi-rate">0%</div>
        </div>
        <div class="stat-card">
          <div class="label">בתי אב / רשומות</div>
          <div class="value" id="kpi-records">0</div>
        </div>
      </div>

      <!-- גרפים -->
      <div class="charts-grid">
        <div class="chart-card">
          <h3>התפלגות סטטוס מענה</h3>
          <div class="chart-wrapper">
            <canvas id="statusChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3>מוזמנים מול מגיעים לפי קבוצה</h3>
          <div class="chart-wrapper">
            <canvas id="groupChart"></canvas>
          </div>
        </div>
      </div>

      <!-- סינונים -->
      <div class="filters-bar">
        <div class="filter-item">
          <label>קבוצה:</label>
          <select id="filter-group" onchange="applyFilters()">
            <option value="ALL">כל הקבוצות</option>
          </select>
        </div>
        <div class="filter-item">
          <label>סטטוס:</label>
          <select id="filter-status" onchange="applyFilters()">
            <option value="ALL">כל הסטטוסים</option>
          </select>
        </div>
        <div class="filter-item" style="flex: 1; min-width: 200px;">
          <input type="text" id="filter-search" placeholder="חיפוש לפי שם אורח או הערות..." style="width: 100%;" oninput="applyFilters()">
        </div>
      </div>

      <!-- טבלת רשומות -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>שם אורח</th>
              <th>קבוצה</th>
              <th>סטטוס</th>
              <th>מוזמנים</th>
              <th>מגיעים</th>
              <th>הערות</th>
            </tr>
          </thead>
          <tbody id="guests-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let rawData = [];
    let statusChartInstance = null;
    let groupChartInstance = null;

    // אימות סיסמה
    function checkAuth() {
      const pwd = document.getElementById('password-input').value.trim();
      if (pwd === "שחר") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        loadDefaultExcel();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // ניסיון טעינה אוטומטית מקבצים באותה התיקייה
    async function loadDefaultExcel() {
      // נבדוק שמות נפוצים (guests.xlsx או הקובץ המקורי)
      const possibleNames = ['guests.xlsx', 'guests (2).xlsx'];
      let loaded = false;

      for (const filename of possibleNames) {
        try {
          const res = await fetch(filename);
          if (res.ok) {
            const arrayBuffer = await res.arrayBuffer();
            parseExcel(arrayBuffer);
            document.getElementById('file-status').textContent = `קובץ פעיל: ${filename}`;
            loaded = true;
            break;
          }
        } catch (e) {
          // fetch נכשל (למשל פתיחה מקומית כקובץ file://)
        }
      }

      if (!loaded) {
        document.getElementById('loading-state').innerHTML = `
          ⚠️ לא נמצא קובץ <code>guests.xlsx</code> בתיקייה או שהדף נפתח מקומית בדפדפן.<br>
          <span style="font-size: 15px;">אנא בחר את הקובץ ידנית באמצעות הכפתור <b>"החלף/טען קובץ ידנית"</b> למעלה.</span>
        `;
      }
    }

    // קריאת קובץ ידנית
    function handleManualFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        parseExcel(e.target.result);
        document.getElementById('file-status').textContent = `קובץ נטען ידנית: ${file.name}`;
      };
      reader.readAsArrayBuffer(file);
    }

    // פענוח נתוני האקסל
    function parseExcel(data) {
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.SheetNames[0];
      const sheet = workbook.Sheets[firstSheet];
      let json = XLSX.utils.sheet_to_json(sheet);

      // נרמול וניקוי נתונים
      rawData = json.map(row => {
        let group = (row['קבוצה'] || 'ללא קבוצה').toString().trim();
        if (group === 'משותפים שלנו') group = 'שלנו משותפים';

        return {
          name: (row['שם אורח'] || '').toString().trim(),
          group: group,
          status: (row['סטטוס'] || 'אין מענה').toString().trim(),
          invited: parseInt(row['מוזמנים']) || 0,
          arriving: parseInt(row['מגיעים']) || 0,
          notes: [row['הערות מנהל'], row['הערות אורח']].filter(Boolean).join(' | ')
        };
      });

      populateFilterOptions();
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('dashboard-content').style.display = 'block';
      applyFilters();
    }

    function populateFilterOptions() {
      const groupSelect = document.getElementById('filter-group');
      const statusSelect = document.getElementById('filter-status');

      const groups = [...new Set(rawData.map(d => d.group))].sort();
      const statuses = [...new Set(rawData.map(d => d.status))].sort();

      groupSelect.innerHTML = '<option value="ALL">כל הקבוצות</option>' + 
        groups.map(g => `<option value="${g}">${g}</option>`).join('');

      statusSelect.innerHTML = '<option value="ALL">כל הסטטוסים</option>' + 
        statuses.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function applyFilters() {
      const selectedGroup = document.getElementById('filter-group').value;
      const selectedStatus = document.getElementById('filter-status').value;
      const query = document.getElementById('filter-search').value.toLowerCase().trim();

      const filtered = rawData.filter(d => {
        const matchesGroup = (selectedGroup === 'ALL' || d.group === selectedGroup);
        const matchesStatus = (selectedStatus === 'ALL' || d.status === selectedStatus);
        const matchesSearch = !query || 
          d.name.toLowerCase().includes(query) || 
          d.notes.toLowerCase().includes(query);
        return matchesGroup && matchesStatus && matchesSearch;
      });

      renderKPIs(filtered);
      renderCharts(filtered);
      renderTable(filtered);
    }

    function renderKPIs(data) {
      const totalInvited = data.reduce((acc, d) => acc + d.invited, 0);
      const totalArriving = data.reduce((acc, d) => acc + d.arriving, 0);
      const rate = totalInvited > 0 ? ((totalArriving / totalInvited) * 100).toFixed(1) : 0;

      document.getElementById('kpi-invited').textContent = totalInvited.toLocaleString();
      document.getElementById('kpi-arriving').textContent = totalArriving.toLocaleString();
      document.getElementById('kpi-rate').textContent = `${rate}%`;
      document.getElementById('kpi-records').textContent = data.length.toLocaleString();
    }

    function renderCharts(data) {
      // 1. פילוח סטטוסים
      const statusCounts = {};
      data.forEach(d => {
        statusCounts[d.status] = (statusCounts[d.status] || 0) + 1;
      });

      const statusLabels = Object.keys(statusCounts);
      const statusValues = Object.values(statusCounts);

      if (statusChartInstance) statusChartInstance.destroy();
      const ctx1 = document.getElementById('statusChart').getContext('2d');
      statusChartInstance = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: statusLabels,
          datasets: [{
            data: statusValues,
            backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#94a3b8', '#3b82f6']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      });

      // 2. מוזמנים מול מגיעים לפי קבוצה
      const groupData = {};
      data.forEach(d => {
        if (!groupData[d.group]) groupData[d.group] = { invited: 0, arriving: 0 };
        groupData[d.group].invited += d.invited;
        groupData[d.group].arriving += d.arriving;
      });

      const groupLabels = Object.keys(groupData);
      const invitedByGroup = groupLabels.map(g => groupData[g].invited);
      const arrivingByGroup = groupLabels.map(g => groupData[g].arriving);

      if (groupChartInstance) groupChartInstance.destroy();
      const ctx2 = document.getElementById('groupChart').getContext('2d');
      groupChartInstance = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: groupLabels,
          datasets: [
            { label: 'מוזמנים', data: invitedByGroup, backgroundColor: '#94a3b8' },
            { label: 'מגיעים', data: arrivingByGroup, backgroundColor: '#2563eb' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('guests-tbody');
      tbody.innerHTML = data.map(d => {
        let badgeClass = 'badge-none';
        if (d.status.includes('מגיעים')) badgeClass = 'badge-arriving';
        else if (d.status.includes('לא מגיעים')) badgeClass = 'badge-declined';
        else if (d.status.includes('מתלבטים')) badgeClass = 'badge-undecided';

        return `
          <tr>
            <td><strong>${d.name}</strong></td>
            <td>${d.group}</td>
            <td><span class="badge ${badgeClass}">${d.status}</span></td>
            <td>${d.invited}</td>
            <td>${d.arriving}</td>
            <td style="color: var(--text-muted); font-size: 13px;">${d.notes || '-'}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
